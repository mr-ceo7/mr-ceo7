<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0c1017" />
      <stop offset="100%" stop-color="#090d15" />
    </linearGradient>

    <!-- Glowing Orbs -->
    <radialGradient id="glow-cyan" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(240, 90) rotate(90) scale(180 240)">
      <stop stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="1" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-purple" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980, 160) rotate(90) scale(200 260)">
      <stop stop-color="#7c3aed" stop-opacity="0.3" />
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-emerald" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(620, 260) rotate(90) scale(140 320)">
      <stop stop-color="#059669" stop-opacity="0.18" />
      <stop offset="1" stop-color="#059669" stop-opacity="0" />
    </radialGradient>

    <!-- Accent Line Gradient -->
    <linearGradient id="line-grad" x1="100" y1="0" x2="1100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="1" />
      <stop offset="75%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    .mono-tag {
      font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', 'Roboto Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 3px;
      fill: #38bdf8;
    }
    .hero-name {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      font-size: 54px;
      font-weight: 800;
      letter-spacing: -1px;
      fill: url(#title-grad);
    }
    .hero-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 0.2px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1.5px;
      fill: #cbd5e1;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="300" rx="16" fill="url(#grid)" />

  <!-- Ambient Glows -->
  <rect width="1200" height="300" rx="16" fill="url(#glow-cyan)" />
  <rect width="1200" height="300" rx="16" fill="url(#glow-purple)" />
  <rect width="1200" height="300" rx="16" fill="url(#glow-emerald)" />

  <!-- Outer Border -->
  <rect x="1" y="1" width="1198" height="298" rx="15" fill="none" stroke="#334155" stroke-opacity="0.4" stroke-width="1.5" />

  <!-- Top Status Badge -->
  <g transform="translate(100, 52)">
    <rect x="0" y="0" width="370" height="26" rx="13" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="17" class="mono-tag">FULL-STACK &amp; SYSTEMS ENGINEER</text>
  </g>

  <!-- Main Hero Title -->
  <text x="100" y="132" class="hero-name">QASSIM MUSA</text>

  <!-- Subtitle Narrative -->
  <text x="100" y="172" class="hero-sub">Founder @ Galvaniy Techs &bull; AI Infrastructure &bull; Low-Latency Systems &bull; Nairobi, KE</text>

  <!-- Accent Divider Line -->
  <line x1="100" y1="205" x2="1100" y2="205" stroke="url(#line-grad)" stroke-width="1.5" />

  <!-- Technology Badges along the bottom -->
  <g transform="translate(100, 226)">
    <!-- Badge 1: TypeScript -->
    <g transform="translate(0, 0)">
      <rect width="120" height="28" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="14" cy="14" r="3" fill="#3178c6" />
      <text x="26" y="18" class="badge-text">TYPESCRIPT</text>
    </g>

    <!-- Badge 2: Python -->
    <g transform="translate(132, 0)">
      <rect width="90" height="28" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="14" cy="14" r="3" fill="#38bdf8" />
      <text x="26" y="18" class="badge-text">PYTHON</text>
    </g>

    <!-- Badge 3: C++ / Embedded -->
    <g transform="translate(234, 0)">
      <rect width="140" height="28" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="14" cy="14" r="3" fill="#00599c" />
      <text x="26" y="18" class="badge-text">C++ / EMBEDDED</text>
    </g>

    <!-- Badge 4: Kotlin -->
    <g transform="translate(386, 0)">
      <rect width="90" height="28" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="14" cy="14" r="3" fill="#a855f7" />
      <text x="26" y="18" class="badge-text">KOTLIN</text>
    </g>

    <!-- Badge 5: RP2040 / ESP32 -->
    <g transform="translate(488, 0)">
      <rect width="144" height="28" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="14" cy="14" r="3" fill="#10b981" />
      <text x="26" y="18" class="badge-text">RP2040 / ESP32</text>
    </g>

    <!-- Badge 6: Next.js -->
    <g transform="translate(644, 0)">
      <rect width="95" height="28" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="14" cy="14" r="3" fill="#f8fafc" />
      <text x="26" y="18" class="badge-text">NEXT.JS</text>
    </g>
  </g>
</svg>
